# Local stack for orchestrator-demo:
#   app          the orchestrator itself (jar built by ../Dockerfile)
#   Tempo        receives OTLP traces (HTTP :4318 / gRPC :4317) -> trace search
#   Prometheus   scrapes the app's /actuator/prometheus endpoint
#   Grafana      UI on :3000 with both datasources pre-provisioned
# Start with:  docker compose -f docker/docker-compose.yml up
#
# The app connects to the Ollama instance on the Docker host
# (host.docker.internal:11434); override SPRING_AI_OLLAMA_BASE_URL to point
# somewhere else. Control-plane state persists in the orchestrator-config
# volume so agent/workflow edits survive container restarts.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - orchestrator-config:/app/config
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (the app's export endpoint)
      - "3200:3200"   # Tempo query API
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  tempo-data:
  orchestrator-config:
