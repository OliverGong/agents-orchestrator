# Orchestrator stack — the whole service bundle is environment-decoupled:
# every host-specific value goes through a variable (see .env.example), so
# `docker compose up -d --build` produces the same deployment on any machine.
#   app          the orchestrator itself (jar built by ../Dockerfile)
#   postgres     control-plane persistence (v2.0: db backend, cp_* tables)
#   Tempo        receives OTLP traces (HTTP :4318 / gRPC :4317) -> trace search
#   Prometheus   scrapes the app's /actuator/prometheus endpoint
#   Grafana      UI on :3000 with both datasources pre-provisioned
# Start with:  docker compose up -d --build
# Copy .env.example to .env to override anything without editing this file.
name: orchestrator

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    # Versioned image name (APP_VERSION, default = the pom version): push it
    # to a registry to deploy the bundle elsewhere without rebuilding.
    image: orchestrator:${APP_VERSION:-2.1.0}
    environment:
      - SPRING_AI_OLLAMA_BASE_URL=${SPRING_AI_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - ORCHESTRATOR_CONTROL_STORE=${ORCHESTRATOR_CONTROL_STORE:-db}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-orchestrator}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-orchestrator}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-orchestrator}
      # store=db needs the DataSource auto-configuration: clear the default
      # exclusion (empty value) that local file-store boots rely on.
      - ORCHESTRATOR_SPRING_EXCLUDE=
      - ORCHESTRATOR_CRYPTO_KEY=${ORCHESTRATOR_CRYPTO_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - orchestrator-config:/app/config
    depends_on:
      tempo:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=orchestrator
      - POSTGRES_USER=orchestrator
      - POSTGRES_PASSWORD=orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (the app's export endpoint)
      - "3200:3200"   # Tempo query API
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  tempo-data:
  orchestrator-config:
  postgres-data:
