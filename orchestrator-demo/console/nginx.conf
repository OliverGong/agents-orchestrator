# Orchestrator console (v3.0 SPA) — static hosting + same-origin API proxy.
# Upstream is the `app` service of docker/docker-compose.yml, resolved at
# request time through Docker's embedded DNS (127.0.0.11) so nginx also boots
# when the backend is temporarily down or the image runs outside the compose
# network (API calls then return 502 instead of the whole console dying).
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:8080;

    root /usr/share/nginx/html;
    index index.html;

    # History-mode SPA: every unknown path falls back to the app shell so
    # deep links like /runs, /instances?businessId=... are served by Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> the orchestrator.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE run-event stream: disable buffering so events are flushed to the
    # browser immediately, and keep the connection open beyond a run's
    # lifetime (this prefix matches before the /api/ block above).
    location /api/v1/events/stream {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    # Actuator (health dot + observability panels).
    location /actuator/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}
