spring.application.name=orchestrator-demo

# ============================================================================
# 1. Backend selection (provider level)
#    `spring.ai.model.chat` picks the chat backend; connection settings use
#    the standard Spring AI properties of that provider.
#    Switch to `openai` and provide `spring.ai.openai.api-key` to use OpenAI.
# ============================================================================
spring.ai.model.chat=ollama

# --- Ollama backend ---
spring.ai.ollama.base-url=http://localhost:11434
# Backend default model, used by agents that do not override `orchestrator.agents.<name>.model`.
# spring.ai.ollama.chat.options.model=qwen:7b
spring.ai.ollama.chat.options.model=qwen3-vl:4b

# --- OpenAI backend (uncomment to switch) ---
# spring.ai.openai.api-key=${OPENAI_API_KEY}
# spring.ai.openai.chat.options.model=gpt-4o-mini

# Disable the modalities this demo does not use; otherwise the OpenAI starter
# autoconfiguration demands credentials even when OpenAI is not the chat backend.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# ============================================================================
# 2. Per-agent model selection (agent level)
#    model / temperature per agent; omit an entry to inherit the backend
#    defaults above.
# ============================================================================
orchestrator.agents.research.model=qwen:7b
orchestrator.agents.research.temperature=0.7

orchestrator.agents.budget.model=qwen:7b
orchestrator.agents.budget.temperature=0.3

orchestrator.agents.itinerary.model=qwen:7b
orchestrator.agents.itinerary.temperature=0.7

orchestrator.agents.review.model=qwen:7b
orchestrator.agents.review.temperature=0.2

# ============================================================================
# 3. Collaboration template (workflow level)
#    `mode` selects sequential or concurrent execution (stages without pending
#    dependencies then run in parallel on virtual threads). Without further
#    configuration the built-in template applies:
#    research -> budget -> itinerary -> review.
#    The built-in `template` switch selects between the strict chain
#    (sequential, default) and the parallel demo layout:
#    research -> (budget || itinerary) -> review — under mode=concurrent the
#    budget and itinerary stages then run in the same wave from the same
#    snapshot; the itinerary agent plans against the user's budget alone and
#    the review stage reconciles both contributions.
#
#    orchestrator.workflow.template=parallel
#    orchestrator.workflow.mode=concurrent
#
#    To define a fully custom template, declare the stages as a list (the
#    index defines the declaration order); `agent` defaults to the stage name
#    and `depends-on` lists the stages that must complete first (also
#    editable at runtime through the control plane, PUT /api/v1/control/workflow):
#
#    orchestrator.workflow.stages[0].name=research
#    orchestrator.workflow.stages[1].name=budget
#    orchestrator.workflow.stages[1].depends-on=research
#    orchestrator.workflow.stages[2].name=itinerary
#    orchestrator.workflow.stages[2].depends-on=research,budget
#    orchestrator.workflow.stages[3].name=review
#    orchestrator.workflow.stages[3].depends-on=research,budget,itinerary
# ============================================================================
orchestrator.workflow.mode=sequential

# ============================================================================
# 4. Observability (traces -> OTLP/Grafana Tempo, metrics -> Prometheus)
#    Every run produces: an `orchestrator.planTrip` span with one child
#    `agent.execute` span per stage (tagged `agent`), agent duration metrics
#    (`agent.execution.duration`, tags `agent`/`outcome`), run/stage process
#    metrics (`orchestrator.run.*`, `orchestrator.stage.*`) and a queryable
#    per-run timeline with the full agent context at
#    GET /api/trips/runs and GET /api/trips/runs/{runId}.
#    Actuator endpoints: /actuator/health (with the `orchestrator` component
#    details), /actuator/info (live workflow configuration), /actuator/metrics
#    and /actuator/prometheus.
#    Start the visualization stack with:
#      docker compose -f docker/docker-compose.yml up
#    Grafana http://localhost:3000 (Tempo trace search + Prometheus metrics).
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.opentelemetry.tracing.sampler=always-on
# gRPC transport: the OTLP/HTTP exporter gets 404 from Tempo's receiver
# (first batch accepted, later batches rejected), so spans never reach
# Grafana Tempo. gRPC (4317) exports reliably.
management.opentelemetry.tracing.export.otlp.transport=grpc
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
# Tempo does not accept OTLP metrics (/v1/metrics -> 404, logged every minute).
# Metrics already go to Prometheus via /actuator/prometheus; keep it that way.
management.otlp.metrics.export.enabled=false
# Histogram buckets for the run/agent duration timers, so Grafana can compute
# p95 with histogram_quantile(...) over the *_seconds_bucket series.
management.metrics.distribution.percentiles-histogram.agent.execution.duration=true
management.metrics.distribution.percentiles-histogram.orchestrator.run.duration=true

# ============================================================================
# 5. Console (static frontend)
#    Always revalidate static assets so edits to the console show up on a
#    plain reload during development.
# ============================================================================
spring.web.resources.cache.cachecontrol.no-cache=true

# ============================================================================
# 6. Control plane (runtime-editable agent configuration)
#    GET/PUT /api/v1/control/agents/{name} (system prompt, model, temperature,
#    calibration rules, MCP mapping), /api/v1/control/workflow (template hot
#    swap), /api/v1/control/mcp/servers, /api/v1/control/models and the live
#    event stream /api/v1/events/stream.
#
#    Persistence backend (orchestrator.control.store):
#      file (default) - versioned JSON at orchestrator.control.config-file;
#            seeded from the built-in personas and the properties above.
#            Point it at a writable path (in Docker: /app/config, volume
#            mounted by docker/docker-compose.yml).
#      db             - PostgreSQL via spring.datasource.* (see docker compose);
#            normalized cp_* tables are created idempotently at boot; an
#            existing JSON state file is imported once when the DB is empty.
#            Requires spring-boot-starter-jdbc + the PostgreSQL driver.
# ============================================================================
orchestrator.control.config-file=config/control-plane.json
orchestrator.control.store=file
orchestrator.control.store.cache-ttl-seconds=30
# Field-level AES-GCM encryption key for secret values (MCP server env).
# Empty = plaintext persistence (fine for the file backend; the DB backend
# warns). In Docker: pass ORCHESTRATOR_CRYPTO_KEY.
orchestrator.control.crypto.key=${ORCHESTRATOR_CRYPTO_KEY:}

# ============================================================================
# 7. Optional DataSource
#    The JDBC starter is on the classpath for store=db, but a bare local boot
#    (store=file) has no spring.datasource.url; its auto-configuration would
#    fail the startup. Excluded by default, docker-compose (store=db) clears
#    this with ORCHESTRATOR_SPRING_EXCLUDE= (empty).
# ============================================================================
spring.autoconfigure.exclude=${ORCHESTRATOR_SPRING_EXCLUDE:org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration}
